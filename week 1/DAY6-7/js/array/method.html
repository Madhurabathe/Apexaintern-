<!DOCTYPE html>
<html>
<body>

<p id="demo"></p>

<script>
const numbers1 = [45, 4, 9, 16, 25];
const numbers2 = numbers1.map(myFunction);

document.getElementById("demo").innerHTML = JSON.stringify(numbers2);

function myFunction(value) {
  return value * 2;
}
</script>

</body>
</html>
